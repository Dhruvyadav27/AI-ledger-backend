spring.application.name=studyplan-ai

# ---- Server ----
server.port=${PORT:8080}

# ---- MongoDB (local instance) ----
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/studyplan_ai}

# ---- JWT ----
# Secret used to sign tokens. In production move this to an environment variable.
# This one is a random base64 string, 256+ bits, required by HS256.
jwt.secret=${JWT_SECRET:8f42a1c9e7b3d6f0a5c8e1b4d7f0a3c6e9b2d5f8a1c4e7b0d3f6a9c2e5b8d1f4}
# Token validity in milliseconds (currently 7 days)
jwt.expiration-ms=604800000

# ---- Gemini AI (used starting Phase 2) ----
# Get a free key from https://ai.studio (Google AI Studio) -> API keys
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.6-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta

# ---- CORS ----
# Vite dev server default port
app.cors.allowed-origins=http://localhost:3000
study.max-weight-per-day=3
# ---- Email (Forgot Password) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL of the frontend - used to build the password-reset link sent in email
app.frontend-url=http://localhost:3000

# How long a reset token stays valid (15 minutes, in milliseconds)
app.reset-token-expiry-ms=900000
